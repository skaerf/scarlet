spring.application.name=scarlet
spring.datasource.url=jdbc:postgresql://localhost:5432/scarlet
spring.datasource.username=scarlet
spring.datasource.password=${SCARLET_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

scarlet.llm.enabled=${SCARLET_LLM_ENABLED:false}
scarlet.llm.base-url=${SCARLET_LLM_BASE_URL:}
scarlet.llm.model=${SCARLET_LLM_MODEL:}
scarlet.llm.api-key=${SCARLET_LLM_API_KEY:}
scarlet.llm.request-timeout=${SCARLET_LLM_REQUEST_TIMEOUT:30s}
